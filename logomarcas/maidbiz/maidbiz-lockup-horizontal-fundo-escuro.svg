<svg width="1040" height="320" viewBox="0 0 1040 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MaidBiz logo (dark background)">
  <defs>
    <linearGradient id="buzTileD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#31DCC7"/>
      <stop offset="1" stop-color="#0EA5C4"/>
    </linearGradient>
  </defs>

  <!-- Icon tile keeps the gradient -->
  <g transform="translate(34,34) scale(0.492)">
    <rect x="0" y="0" width="512" height="512" rx="108" ry="108" fill="url(#buzTileD)"/>
    <path d="M 140,266 L 224,346 L 380,150"
          fill="none" stroke="#FFFFFF" stroke-width="40"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark entirely white for dark backgrounds -->
  <text x="322" y="160" font-family="Inter, 'Segoe UI', system-ui, sans-serif"
        font-weight="700" font-size="150" letter-spacing="-5"
        dominant-baseline="middle" fill="#FFFFFF">
    <tspan>Maid</tspan><tspan>Biz</tspan>
  </text>
</svg>
