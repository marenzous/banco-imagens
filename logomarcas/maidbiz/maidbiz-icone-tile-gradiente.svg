<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MaidBiz app icon">
  <defs>
    <linearGradient id="buzTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#31DCC7"/>
      <stop offset="1" stop-color="#0EA5C4"/>
    </linearGradient>
    <filter id="buzShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0EA5C4" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Rounded-square tile with diagonal aqua->cyan gradient -->
  <rect x="24" y="24" width="464" height="464" rx="102" ry="102"
        fill="url(#buzTile)" filter="url(#buzShadow)"/>

  <!-- Checkmark mark (job done / task complete) -->
  <path d="M 140,266 L 224,346 L 380,150"
        fill="none" stroke="#FFFFFF" stroke-width="40"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
